name: BTC H3 Cloud Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-h3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect H3
        run: |
          python h3_bybit.py > h3_latest.tmp.json

      - name: Validate H3
        run: |
          python - <<'PY'
          import json

          required = [
              "ticker",
              "1H",
              "4H",
              "OI_1H",
              "OI_4H",
              "LS_1H",
              "LS_4H",
          ]

          with open("h3_latest.tmp.json", "r") as f:
              data = json.load(f)

          integrity = data.get("data_integrity", {})

          bad = [x for x in required if integrity.get(x) is not True]

          if bad:
              print("H3 validation FAILED")
              print("Invalid blocks:", bad)
              raise SystemExit(1)

          print("H3 validation OK")
          PY

      - name: Install validated H3
        run: |
          mv h3_latest.tmp.json h3_latest.json

      - name: Commit updated H3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add h3_latest.json

          if git diff --cached --quiet; then
            echo "No H3 changes."
          else
            git commit -m "H3 cloud update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
